name: update open source contribution stats

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day, like the snake
  workflow_dispatch:          # let me run it by hand
  push:
    branches: [main]
    paths:
      - scripts/update_oss_stats.py
      - .github/workflows/oss-stats.yml

permissions:
  contents: write

concurrency:
  group: oss-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the stats section
        env:
          # The default token is enough: everything queried is public.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_oss_stats.py

      - name: Regenerate the quotes section
        # Reads the curated kudos file from the site, so the profile and the
        # site cannot drift. A fetch failure leaves the existing quotes in
        # place rather than failing the run.
        run: python scripts/update_kudos.py

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh open source contribution stats"
          git push
